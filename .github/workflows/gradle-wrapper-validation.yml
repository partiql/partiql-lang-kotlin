name: "Validate Gradle Wrapper"
on:
  push:
    branches:
      - main     # Triggers only when code is merged into main
  pull_request:  # Triggers for any PR creation or update

permissions:
  contents: read

jobs:
  validation:
    name: "Gradle wrapper validation"
    # CodeBuild-hosted runner for this repository; forks (which do not have it) fall back to GitHub-hosted runners.
    runs-on: ${{ github.repository == 'partiql/partiql-lang-kotlin' && format('codebuild-partiql-lang-kotlin-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
